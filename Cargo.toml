[package]
name = "world-kernel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Experimental runtime for grounded, admitted, replayable changes"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

